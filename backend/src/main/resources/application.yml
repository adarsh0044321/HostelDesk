server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: hosteldesk-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

hosteldesk:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}

---
# Default Profile: PostgreSQL (Supabase Cloud Database)
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres.qxdhyoylzdaagvtlymhd}
    password: ${DB_PASSWORD:jaisingh@044}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false # Handled via JPA / explicit Flyway runner

---
# Development & Testing Profile: Embedded H2 with PostgreSQL Compatibility
spring:
  config:
    activate:
      on-profile: dev,test
  datasource:
    url: jdbc:h2:mem:hosteldesk;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
